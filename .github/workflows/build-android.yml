name: Build Android APK & AAB (Cloud CI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release for standalone APK, debug for dev testing)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      release_tag:
        description: 'Release Tag override (optional, defaults to package.json version)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish a GitHub Release (the website download points at the latest one)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: 1
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://api.zerodaily.in

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Determine Release Version Tag
        id: release_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CUSTOM_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$PKG_VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode Signing Keystores
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 / ANDROID_UPLOAD_KEYSTORE_BASE64 secrets are not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Play Store App Bundle (upload key)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=zerodaily-upload \
            -Pandroid.injected.signing.key.password="$STORE_PASSWORD"

      - name: Assemble Standalone Release APK (app signing key)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=zerodaily-release \
            -Pandroid.injected.signing.key.password="$STORE_PASSWORD"

      - name: Assemble Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Direct APK File & Checksums
        id: prepare_assets
        run: |
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK found in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found raw APK at: $RAW_APK"
          mkdir -p build_output
          cp "$RAW_APK" build_output/ZeroDaily.apk

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "APK certificate:"
          $APKSIGNER verify --print-certs build_output/ZeroDaily.apk

          RAW_AAB=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$RAW_AAB" ]; then
            cp "$RAW_AAB" build_output/ZeroDaily.aab
            echo "AAB certificate:"
            keytool -printcert -jarfile build_output/ZeroDaily.aab | grep -E "Owner|SHA256:"
          fi

          TAG_NAME="${{ steps.release_version.outputs.tag }}"

          # Calculate SHA256 & APK size
          cd build_output
          APK_SHA256=$(sha256sum ZeroDaily.apk | awk '{print $1}')
          APK_SIZE=$(ls -lh ZeroDaily.apk | awk '{print $5}')
          echo "sha256=$APK_SHA256" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

          # Generate SHA256 Checksums (.txt)
          sha256sum ZeroDaily.apk > ZeroDaily-SHA256.txt
          echo "Commit SHA: ${{ github.sha }}" >> ZeroDaily-SHA256.txt
          echo "Release Tag: $TAG_NAME" >> ZeroDaily-SHA256.txt
          echo "Build Timestamp UTC: $(date -u)" >> ZeroDaily-SHA256.txt
          cat ZeroDaily-SHA256.txt
          cd ..

          # Output directly to GitHub Actions Step Summary
          echo "## ZeroDaily Android APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | \`${TAG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK File** | \`ZeroDaily.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK File Size** | \`${APK_SIZE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256 Checksum** | \`${APK_SHA256}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Timestamp** | \`$(date -u)\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Direct SHA-256**: \`${APK_SHA256}\`" >> $GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: "ZeroDaily Mobile Release ${{ steps.release_version.outputs.tag }}"
          body: |
            ### ZeroDaily Mobile Release ${{ steps.release_version.outputs.tag }}
            - **Standalone Release Build**: Full offline JS bundle embedded (no Metro dev server required).
            - **Backend API**: Configured directly to `https://api.zerodaily.in`.
            - **APK File Size**: `${{ steps.prepare_assets.outputs.apk_size }}`
            - **Commit SHA**: `${{ github.sha }}`

            #### Direct SHA-256 Checksum:
            ```text
            ${{ steps.prepare_assets.outputs.sha256 }}  ZeroDaily.apk
            ```

            #### Release Assets Included:
            - [`ZeroDaily.apk`](https://github.com/err0rgod/zerodaily-app/releases/download/${{ steps.release_version.outputs.tag }}/ZeroDaily.apk) — Standalone Android Release APK (${{ steps.prepare_assets.outputs.apk_size }})
            - `ZeroDaily-SHA256.txt` — SHA256 Checksum and Git Commit verification
          files: |
            build_output/ZeroDaily.apk
            build_output/ZeroDaily-SHA256.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDaily-Android-${{ github.event.inputs.build_type || 'release' }}-apk
          path: build_output/ZeroDaily.apk
          retention-days: 14

      - name: Upload AAB Artifact (Play Console)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDaily-Android-release-aab
          path: build_output/ZeroDaily.aab
          retention-days: 30
