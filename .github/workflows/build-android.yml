name: Build Android APK (Cloud CI)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release for standalone APK, debug for dev testing)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      release_tag:
        description: 'Release Tag override (optional, defaults to package.json version)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: 1
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://api.zerodaily.in

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏷️ Determine Release Version Tag
        id: release_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CUSTOM_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
          else
            TAG="v$PKG_VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🐘 Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Grant Execute Permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: 🏗️ Assemble Standalone Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' }}
        working-directory: android
        run: ./gradlew assembleRelease -PkotlinVersion=1.9.25 --no-daemon --stacktrace

      - name: 🏗️ Assemble Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug -PkotlinVersion=1.9.25 --no-daemon --stacktrace

      - name: 📦 Prepare Direct APK File, Checksums & Source Archives
        id: prepare_assets
        run: |
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK found in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found raw APK at: $RAW_APK"
          mkdir -p build_output
          cp "$RAW_APK" build_output/ZeroDaily.apk

          TAG_NAME="${{ steps.release_version.outputs.tag }}"

          # 1. Generate SHA256 Checksums (.txt)
          cd build_output
          sha256sum ZeroDaily.apk > ZeroDaily-SHA256.txt
          echo "Commit SHA: ${{ github.sha }}" >> ZeroDaily-SHA256.txt
          echo "Release Tag: $TAG_NAME" >> ZeroDaily-SHA256.txt
          echo "Build Timestamp UTC: $(date -u)" >> ZeroDaily-SHA256.txt
          cat ZeroDaily-SHA256.txt
          cd ..

          # 2. Package Clean Source Code Archives (.zip and .tar.gz)
          git archive --format=zip --output=build_output/source-code.zip HEAD
          git archive --format=tar.gz --output=build_output/source-code.tar.gz HEAD

      - name: 🏷️ Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: "ZeroDaily Mobile Release ${{ steps.release_version.outputs.tag }}"
          body: |
            ### 📱 ZeroDaily Mobile Release ${{ steps.release_version.outputs.tag }}
            - **Standalone Release Build**: Full offline JS bundle embedded (no Metro dev server required).
            - **Backend API**: Configured directly to `https://api.zerodaily.in`.
            - **Commit SHA**: `${{ github.sha }}`

            #### 📦 Release Assets Included:
            - `ZeroDaily.apk` — Standalone Android Release APK
            - `ZeroDaily-SHA256.txt` — SHA256 Checksum and Git Commit verification
            - `source-code.zip` — Source code archive (.zip)
            - `source-code.tar.gz` — Source code archive (.tar.gz)
          files: |
            build_output/ZeroDaily.apk
            build_output/ZeroDaily-SHA256.txt
            build_output/source-code.zip
            build_output/source-code.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDaily-Android-${{ github.event.inputs.build_type || 'release' }}-apk
          path: build_output/ZeroDaily.apk
          retention-days: 14
