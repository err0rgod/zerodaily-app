name: Build Android APK (Cloud CI)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release for standalone APK, debug for dev testing)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: 1
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://api.zerodaily.in

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🐘 Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Grant Execute Permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: 🏗️ Assemble Standalone Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' }}
        working-directory: android
        run: ./gradlew assembleRelease -PkotlinVersion=1.9.25 --no-daemon --stacktrace

      - name: 🏗️ Assemble Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug -PkotlinVersion=1.9.25 --no-daemon --stacktrace

      - name: 📦 Prepare Direct APK File
        id: find_apk
        run: |
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK found in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found raw APK at: $RAW_APK"
          mkdir -p build_output
          cp "$RAW_APK" build_output/ZeroDaily.apk
          echo "apk_path=build_output/ZeroDaily.apk" >> $GITHUB_OUTPUT

      - name: 🏷️ Publish Direct Download Release (No Zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ZeroDaily Mobile App (Latest Standalone APK)"
          body: |
            ### 📱 ZeroDaily Mobile Release
            - **Standalone Release Build**: Full offline JS bundle embedded (no Metro dev server required).
            - **Backend API**: Configured directly to `https://api.zerodaily.in`.
            - **Direct Download**: Tap `ZeroDaily.apk` below to download directly without unzipping.
          files: build_output/ZeroDaily.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDaily-Android-${{ github.event.inputs.build_type || 'release' }}-apk
          path: build_output/ZeroDaily.apk
          retention-days: 14
